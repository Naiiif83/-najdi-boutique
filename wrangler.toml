name = "najdi-boutique"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# قاعدة البيانات (المنتجات + الطلبات)
[[d1_databases]]
binding = "DB"
database_name = "najdi-boutique-db"
database_id = "34d884db-df5c-4964-9f3e-a5efe509c462"

# متغيرات بيئية عامة (غير سرية) - يمكن ضبطها أيضاً من لوحة Cloudflare Pages
[vars]
STORE_NAME = "بسطة الوالدة"
MOYASAR_PUBLISHABLE_KEY = "pk_test_REPLACE_ME"
GITHUB_OWNER = "Naiiif83"
GITHUB_REPO = "-najdi-boutique"
GITHUB_BRANCH = "main"

# المتغيرات السرية التالية لا تُكتب هنا، بل تُضاف من الترمنال بأمر:
#   npx wrangler pages secret put NAME --project-name=najdi-boutique
#   ADMIN_PASSWORD          كلمة مرور دخول لوحة التحكم
#   ADMIN_SESSION_SECRET    نص عشوائي طويل لتوقيع جلسة الدخول
#   GITHUB_TOKEN            توكن GitHub (صلاحية Contents: Read & Write) لرفع صور المنتجات
#   MOYASAR_SECRET_KEY      المفتاح السري من حساب Moyasar للتحقق من الدفع (اختياري بالبداية)

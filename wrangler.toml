name = "najdi-boutique"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# قاعدة البيانات (المنتجات + الطلبات)
[[d1_databases]]
binding = "DB"
database_name = "najdi-boutique-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# تخزين الصور (الصور العادية + صور الدوران 360)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "najdi-boutique-images"

# متغيرات بيئية عامة (غير سرية) - يمكن ضبطها أيضاً من لوحة Cloudflare Pages
[vars]
STORE_NAME = "بسطة الوالدة"
MOYASAR_PUBLISHABLE_KEY = "pk_test_REPLACE_ME"

# المتغيرات السرية التالية لا تُكتب هنا، بل تُضاف من لوحة تحكم Cloudflare Pages
# (Settings -> Environment variables -> Encrypt):
#   ADMIN_PASSWORD          كلمة مرور دخول لوحة التحكم
#   ADMIN_SESSION_SECRET    نص عشوائي طويل لتوقيع جلسة الدخول
#   MOYASAR_SECRET_KEY      المفتاح السري من حساب Moyasar للتحقق من الدفع
